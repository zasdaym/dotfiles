[settings]
experimental = true
minimum_release_age = "0s"
plugin_autoupdate_last_check_duration = "0"
dotfiles.root = "~/.dotfiles"
dotfiles.default_mode = "symlink"
fetch_remote_versions_timeout = "5m"

[settings.npm]
package_manager = "bun"

[tools]
argocd = "latest"
aws = { version = "latest", symlink_bins = "true" }
buf = "latest"
bun = "latest"
claude = "latest"
codex = "latest"
d2 = "latest"
dotenvx = "latest"
elixir = "latest"
erlang = "latest"
fd = "latest"
flyctl = "latest"
fzf = "latest"
gcloud = "latest"
gh = "latest"
glab = "latest"
go = "latest"
"go:golang.org/x/tools/gopls" = "latest"
helm = "latest"
helmfile = "latest"
herdr = "latest"
hurl = "latest"
hyperfine = "latest"
jq = "latest"
jujutsu = "latest"
kind = "latest"
kubectl = "latest"
neovim = "latest"
node = "latest"
opencode = "latest"
opentofu = "latest"
rg = "latest"
rust = "latest"
sd = "latest"
shellcheck = "latest"
starship = "latest"
terraform = "latest"
tombi = "latest"
tree-sitter = "latest"
ty = "latest"
typst = "latest"
usage = "latest"
uv = "latest"
yq = "latest"
zoxide = "latest"

"aqua:grafana/gcx" = "latest"
"github:almonk/bontree" = "latest"
"github:badranX/vim4helix" = "latest"
"github:nklmilojevic/sofka" = "latest"
"github:jnsahaj/lumen" = "latest"
"github:jsdelivr/globalping-cli" = "latest"
"github:sarub0b0/kubetui" = "latest"
"github:skyhook-io/radar" = "latest"

"npm:@astrojs/language-server" = "latest"
"npm:bash-language-server" = "latest"
"npm:typescript-language-server" = "latest"
"npm:yaml-language-server" = "latest"

[dotfiles]
# symlink-each lets ~/.config (etc.) coexist with unmanaged files while linking
# individual managed files into place.
"~/.agents" = { source = ".agents", mode = "symlink-each" }
"~/.config" = { source = ".config", mode = "symlink-each" }
"~/.ssh" = { source = ".ssh", mode = "symlink-each" }
"~/.claude/CLAUDE.md" = ".claude/CLAUDE.md"
"~/.config/AGENTS.md" = ".claude/CLAUDE.md"
"~/.codex/AGENTS.md" = ".claude/CLAUDE.md"
"~/.cursor/rules/main.mdc" = ".claude/CLAUDE.md"
# Self-manage the global mise config: symlink it back to this file.
"~/.config/mise/config.toml" = "mise.toml"
"~/.config/mise/config.linux.toml" = "mise.linux.toml"
"~/.config/mise/config.macos.toml" = "mise.macos.toml"

# Homebrew packages.
[bootstrap.packages]
"brew:fish" = "latest"
"brew:mosh" = "latest"
